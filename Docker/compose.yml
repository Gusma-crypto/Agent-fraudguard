name: fraudguard-agent

services:
  agent:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      target: runtime
    image: ${FRAUDGUARD_AGENT_IMAGE:-agent-fraudguard:local}
    env_file:
      - path: ${AGENT_ENV_FILE:-../.env}
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AGENT_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    networks:
      fraudguard-network:
        aliases: [fraudguard-agent-tools]

  bridge:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      target: runtime
    image: ${FRAUDGUARD_AGENT_IMAGE:-agent-fraudguard:local}
    command: ["uvicorn", "fraudguard_agent.openclaw_bridge:app", "--host", "0.0.0.0", "--port", "3100"]
    env_file:
      - path: ${AGENT_ENV_FILE:-../.env}
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OPENCLAW_BRIDGE_PORT:-3100}:3100"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3100/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      fraudguard-network:
        aliases: [fraudguard-agent]

networks:
  fraudguard-network:
    external: true
    name: fraudguard-network
