[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fraudguard-ai-agent"
version = "0.2.0"
description = "Reasoning, conversation, and orchestration layer for FraudGuard Core"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fraudguard_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
